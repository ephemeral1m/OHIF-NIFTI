worker_processes auto;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/json;
  keepalive_timeout 180;
  server {
    listen 1026;
    auth_basic "OHIF NIfTI acceptance";
    auth_basic_user_file /etc/nginx/.htpasswd;
    client_max_body_size 500M;
    location /_nifti-files/ {
      internal;
      alias /var/nifti-images/;
    }
    location /_nifti-stream-cache/ {
      internal;
      alias /var/nifti-stream-cache/;
      etag off;
      add_header ETag $upstream_http_etag;
      add_header X-Nifti-Cache-Key $upstream_http_x_nifti_cache_key;
      add_header X-Nifti-Frame $upstream_http_x_nifti_frame;
    }
    location /pacs/ {
      proxy_pass http://orthanc:8042/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 300s;
    }
    location /monai/nifti-images {
      client_max_body_size 520M;
      proxy_pass http://monai_sam2:8002/nifti-images;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
    location /monai/ {
      proxy_pass http://monai_sam2:8002/;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
    location ~ "\.[a-f0-9]{16,}\.(js|css|wasm|woff2?)$" {
      root /var/www/html;
      try_files $uri =404;
      add_header Cache-Control "private, max-age=31536000, immutable";
    }
    location / {
      root /var/www/html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store";
    }
  }
}
