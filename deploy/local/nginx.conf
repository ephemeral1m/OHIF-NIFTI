worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 1026;
    client_max_body_size 520M;
    location /_nifti-files/ { internal; alias /var/nifti-images/; }
    location /_nifti-stream-cache/ {
      internal;
      alias /var/nifti-stream-cache/;
      etag off;
      add_header ETag $upstream_http_etag;
      add_header X-Nifti-Cache-Key $upstream_http_x_nifti_cache_key;
      add_header X-Nifti-Frame $upstream_http_x_nifti_frame;
    }
    location /pacs/ {
      proxy_pass http://orthanc:8042/;
      proxy_read_timeout 300s;
    }
    location /wado { proxy_pass http://orthanc:8042/wado; }
    location /monai/ {
      proxy_pass http://backend:8002/;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
    location / {
      proxy_pass http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      add_header Cache-Control no-store;
    }
  }
}
